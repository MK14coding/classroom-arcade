<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Time Racer - Game</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;color:white;background:linear-gradient(135deg,#0f172a,#1e3a8a 45%,#0ea5e9 72%,#facc15);overflow:hidden}.game{height:100vh;max-width:1240px;margin:auto;padding:8px;display:grid;grid-template-rows:auto 1fr;gap:8px}.top{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px;border:3px solid rgba(255,255,255,.55);border-radius:18px;background:rgba(0,0,0,.28)}.top a{text-decoration:none;background:white;color:#1e3a8a;padding:8px 10px;border-radius:10px;font-weight:bold;font-size:14px}.top h1{margin:0;text-align:center;font-size:24px;text-transform:uppercase}.pill{background:white;color:#0f172a;border-radius:12px;padding:8px 10px;font-weight:bold;font-size:14px}.main{min-height:0;display:grid;grid-template-columns:1fr 315px;gap:8px}.play,.garage{min-height:0;border:3px solid rgba(255,255,255,.45);border-radius:20px;background:rgba(0,0,0,.28);padding:8px}.play{display:grid;grid-template-rows:auto auto 1fr;gap:8px}.scorebar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.scorebox{padding:6px;border-radius:13px;background:rgba(255,255,255,.13);border:2px solid rgba(255,255,255,.24);text-align:center}.scorebox span{display:block;font-size:11px}.scorebox strong{display:block;font-size:21px;color:#fef08a}.track{position:relative;height:88px;border-radius:18px;border:3px solid rgba(255,255,255,.45);background:linear-gradient(#334155,#111827);overflow:hidden}.road-line{position:absolute;left:0;right:0;top:42px;border-top:4px dashed rgba(255,255,255,.65)}.finish{position:absolute;right:12px;top:8px;bottom:8px;width:10px;background:repeating-linear-gradient(45deg,#fff 0 6px,#111827 6px 12px)}.race-car{position:absolute;left:12px;top:13px;width:150px;height:66px;transition:left .45s ease,transform .45s ease}.race-car.go{transform:translateX(12px) rotate(-3deg)}.qcard{text-align:center;border-radius:20px;background:rgba(255,255,255,.13);border:2px solid rgba(255,255,255,.28);padding:9px;display:grid;grid-template-columns:230px 1fr;gap:12px;align-items:center;min-height:0}.clock{width:205px;height:205px;border-radius:50%;background:white;border:8px solid #fef08a;position:relative;margin:auto}.num{position:absolute;color:#0f172a;font-weight:bold;font-size:17px;left:50%;top:50%;transform:translate(-50%,-50%)}.hand{position:absolute;left:50%;top:50%;transform-origin:50% 100%;border-radius:999px}.hour{width:8px;height:54px;background:#0f172a;margin-left:-4px;margin-top:-54px}.minute{width:6px;height:74px;background:#0ea5e9;margin-left:-3px;margin-top:-74px}.pin{position:absolute;left:50%;top:50%;width:16px;height:16px;margin-left:-8px;margin-top:-8px;border-radius:50%;background:#ef4444}.quiz{display:grid;gap:8px}.level-title{justify-self:center;padding:6px 12px;border-radius:999px;background:white;color:#1e3a8a;font-weight:bold}.prompt{font-size:19px;font-weight:bold;margin:0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{min-height:42px;border:none;border-radius:14px;background:#fef08a;color:#0f172a;padding:0 10px;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:inset 0 -5px 0 rgba(0,0,0,.13)}button:disabled{opacity:.55}.feedback{min-height:34px;font-size:17px;font-weight:bold}.correct{color:#bbf7d0}.wrong{color:#fecaca}.garage{display:grid;grid-template-rows:auto auto 1fr auto;gap:7px;overflow:hidden}.garage h2{margin:0;text-align:center;color:#fef08a;font-size:21px}.preview{height:78px;border-radius:16px;background:rgba(255,255,255,.12);display:grid;place-items:center}.preview svg{max-height:72px}.packs{display:grid;gap:5px;overflow:hidden}.pack{border:2px solid rgba(255,255,255,.25);border-radius:12px;background:rgba(255,255,255,.12);padding:5px}.pack-head{display:grid;grid-template-columns:26px 1fr auto;gap:5px;align-items:center;font-weight:bold;font-size:13px}.pack-head button{min-height:28px;font-size:12px;padding:0 7px}.options{display:none;grid-template-columns:repeat(2,1fr);gap:4px;margin-top:5px}.pack.unlocked .options{display:grid}.option{min-height:28px;border-radius:9px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);font-size:12px;color:white;box-shadow:none}.option.selected{background:#fef08a;color:#0f172a}.champ{padding:7px;border-radius:13px;background:rgba(255,255,255,.12);text-align:center;font-weight:bold;font-size:13px}.sparkle{position:absolute;pointer-events:none;font-size:24px;animation:sparkle .9s ease forwards}@keyframes sparkle{0%{opacity:0;transform:translateY(8px) scale(.7)}40%{opacity:1}100%{opacity:0;transform:translateY(-70px) scale(1.2)}}.overlay{position:fixed;inset:0;background:rgba(15,23,42,.84);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}.overlay.visible{display:flex}.complete{width:min(590px,94vw);padding:20px;border:5px solid #fef08a;border-radius:24px;background:linear-gradient(135deg,#1e3a8a,#0ea5e9,#facc15);text-align:center}.complete h2{margin:0 0 8px;font-size:35px}.big{font-size:74px}@media(max-width:950px){html,body{overflow:auto}.game{height:auto;min-height:100vh}.main{grid-template-columns:1fr}.qcard{grid-template-columns:1fr}.scorebar{grid-template-columns:repeat(2,1fr)}.top{grid-template-columns:1fr}}@media(max-height:700px) and (min-width:951px){.track{height:74px}.race-car{width:128px;height:56px;top:10px}.clock{width:178px;height:178px;border-width:6px}.qcard{grid-template-columns:195px 1fr}.hour{height:48px;margin-top:-48px}.minute{height:63px;margin-top:-63px}.prompt{font-size:16px}button{min-height:36px;font-size:14px}.feedback{font-size:14px}.scorebox strong{font-size:18px}.preview{height:62px}.garage h2{font-size:18px}.pack-head,.champ{font-size:12px}}
</style>
</head>
<body>
<main class="game"><header class="top"><a href="index.html">← Change Car</a><h1>Time Racer</h1><div class="pill">Garage upgrades unlocked with Time Tokens</div></header>
<section class="main"><section class="play">
<div class="scorebar"><div class="scorebox"><span>Level</span><strong id="level">1</strong></div><div class="scorebox"><span>Question</span><strong><span id="question">1</span>/<span id="totalQ">8</span></strong></div><div class="scorebox"><span>Tokens</span><strong id="coins">0</strong></div><div class="scorebox"><span>Score</span><strong id="score">0</strong></div><div class="scorebox"><span>Streak</span><strong id="streak">0</strong></div></div>
<div class="track"><div class="road-line"></div><div class="finish"></div><div class="race-car" id="raceCar"></div></div>
<div class="qcard"><div class="clock" id="clock"></div><div class="quiz"><div class="level-title" id="levelTitle">Level 1</div><p class="prompt">What time is shown?</p><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div></div></div>
</section><aside class="garage"><h2>Upgrade Garage</h2><div class="preview" id="carPreview"></div><div class="packs" id="packs"></div><div class="champ" id="champ">Correct answers earn Time Tokens.</div></aside></section></main>
<div class="overlay" id="overlay"><div class="complete"><h2 id="overlayTitle">Level Complete!</h2><div class="big" id="overlayIcon">🏁</div><p id="overlayText">You finished the race.</p><button id="continueBtn" type="button">Continue</button></div></div>
<script>
document.addEventListener("DOMContentLoaded",function(){
const SAVE="timeRacerGarageV3",CARKEY="timeRacerCarV2";
const cars=[{"id": "red", "name": "Lightning Red", "primary": "#ef4444", "secondary": "#991b1b"}, {"id": "blue", "name": "Ocean Blue", "primary": "#0ea5e9", "secondary": "#1e3a8a"}, {"id": "yellow", "name": "Sunshine Yellow", "primary": "#facc15", "secondary": "#ca8a04"}, {"id": "green", "name": "Turbo Green", "primary": "#22c55e", "secondary": "#166534"}, {"id": "purple", "name": "Purple Rocket", "primary": "#a855f7", "secondary": "#581c87"}];
const garage=[{"id": "stickers", "name": "Sticker Pack", "icon": "\u2b50", "cost": 3, "options": [{"id": "stars", "name": "Star Stickers", "icon": "\u2b50"}, {"id": "bolt", "name": "Lightning Sticker", "icon": "\u26a1"}, {"id": "clock", "name": "Clock Sticker", "icon": "\u23f1\ufe0f"}, {"id": "flame", "name": "Flame Sticker", "icon": "\ud83d\udd25"}]}, {"id": "rims", "name": "Rim Pack", "icon": "\ud83d\udede", "cost": 6, "options": [{"id": "silver", "name": "Silver Rims", "icon": "\u26aa"}, {"id": "gold", "name": "Gold Rims", "icon": "\ud83d\udfe1"}, {"id": "neon", "name": "Neon Rims", "icon": "\ud83d\udd35"}]}, {"id": "wing", "name": "Wing Pack", "icon": "\ud83c\udfc1", "cost": 9, "options": [{"id": "small", "name": "Mini Wing", "icon": "\u2796"}, {"id": "racing", "name": "Racing Wing", "icon": "\ud83c\udfc1"}, {"id": "double", "name": "Double Wing", "icon": "\u2550"}]}, {"id": "boost", "name": "Boost Pack", "icon": "\ud83d\udd25", "cost": 12, "options": [{"id": "blue", "name": "Blue Boost", "icon": "\ud83d\udca8"}, {"id": "fire", "name": "Fire Boost", "icon": "\ud83d\udd25"}, {"id": "spark", "name": "Sparkle Boost", "icon": "\u2728"}]}, {"id": "engine", "name": "Engine Pack", "icon": "\u2699\ufe0f", "cost": 15, "options": [{"id": "turbo", "name": "Turbo Engine", "icon": "\u2699\ufe0f"}, {"id": "rocket", "name": "Rocket Engine", "icon": "\ud83d\ude80"}, {"id": "monster", "name": "Monster Engine", "icon": "\ud83d\udcaa"}]}];
const levels=[["O'clock Oval",["oclock"],8,6],["Half-Past Highway",["half"],8,6],["Quarter-Past Circuit",["quarter"],10,7],["Mixed Time Motorway",["oclock","half","quarter"],10,7],["Clock Championship",["oclock","half","quarter"],12,9]];
const $=id=>document.getElementById(id);
let level=1,question=1,score=0,streak=0,coins=0,current,answered=false;
let carId=new URLSearchParams(location.search).get("car")||localStorage.getItem(CARKEY)||"red";
localStorage.setItem(CARKEY,carId);
let saved=load();
function load(){try{return JSON.parse(localStorage.getItem(SAVE)||'{"unlocked":[],"selected":{}}')}catch(e){return{unlocked:[],selected:{}}}}
function save(){localStorage.setItem(SAVE,JSON.stringify(saved))}
function r(a,b){return Math.floor(Math.random()*(b-a+1))+a}function pick(a){return a[r(0,a.length-1)]}function pad(n){return String(n).padStart(2,"0")}function label(h,m){return h+":"+pad(m)}function words(h,m){if(m===0)return h+" o'clock";if(m===30)return"half past "+h;if(m===15)return"quarter past "+h;return label(h,m)}
function car(){return cars.find(c=>c.id===carId)||cars[0]}
function carSvg(){let c=car(),s=saved.selected;let rim=s.rims==="gold"?"#facc15":s.rims==="neon"?"#38bdf8":"#e5e7eb";let sticker=s.stickers==="stars"?"⭐":s.stickers==="bolt"?"⚡":s.stickers==="clock"?"⏱️":s.stickers==="flame"?"🔥":"";let wing=s.wing==="small"?`<rect x="114" y="18" width="28" height="6" rx="3" fill="#e5e7eb"/>`:s.wing==="racing"?`<rect x="108" y="13" width="42" height="7" rx="3" fill="#fef08a"/><rect x="118" y="20" width="5" height="11" fill="#e5e7eb"/>`:s.wing==="double"?`<rect x="106" y="10" width="46" height="6" rx="3" fill="#fef08a"/><rect x="110" y="20" width="40" height="6" rx="3" fill="#e5e7eb"/>`:"";let boost=s.boost==="blue"?`<text x="4" y="43" font-size="18">💨</text>`:s.boost==="fire"?`<text x="6" y="44" font-size="19">🔥</text>`:s.boost==="spark"?`<text x="5" y="44" font-size="19">✨</text>`:"";let engine=s.engine==="turbo"?`<text x="120" y="37" font-size="14">⚙️</text>`:s.engine==="rocket"?`<text x="119" y="38" font-size="15">🚀</text>`:s.engine==="monster"?`<text x="119" y="38" font-size="15">💪</text>`:"";return `<svg viewBox="0 0 165 72" width="100%" height="100%" aria-label="${c.name} race car">${boost}${wing}<rect x="34" y="28" width="96" height="24" rx="10" fill="${c.primary}"/><path d="M55 28 L72 12 H105 L122 28 Z" fill="${c.secondary}"/><text x="78" y="47" font-size="16">${sticker}</text>${engine}<circle cx="53" cy="55" r="11" fill="#111827"/><circle cx="114" cy="55" r="11" fill="#111827"/><circle cx="53" cy="55" r="6" fill="${rim}"/><circle cx="114" cy="55" r="6" fill="${rim}"/></svg>`}
function makeTime(){let t=pick(levels[level-1][1]),h=r(1,12),m=t==="oclock"?0:t==="half"?30:15;return{h,m,label:label(h,m),words:words(h,m)}}
function options(c){let o=[c.label],mins=[0,15,30];while(o.length<4){let v=label(r(1,12),pick(mins));if(!o.includes(v))o.push(v)}return o.sort(()=>Math.random()-.5)}
function drawClock(h,m){let c=$("clock");c.innerHTML="";for(let n=1;n<=12;n++){let d=document.createElement("div");d.className="num";d.textContent=n;let a=(n*30-90)*Math.PI/180;d.style.left=(50+Math.cos(a)*38)+"%";d.style.top=(50+Math.sin(a)*38)+"%";c.appendChild(d)}let hr=document.createElement("div"),mn=document.createElement("div"),pin=document.createElement("div");hr.className="hand hour";mn.className="hand minute";pin.className="pin";hr.style.transform=`rotate(${(h%12)*30+m*.5}deg)`;mn.style.transform=`rotate(${m*6}deg)`;c.append(hr,mn,pin)}
function drawPacks(){$("packs").innerHTML="";garage.forEach(pack=>{let un=saved.unlocked.includes(pack.id);let box=document.createElement("div");box.className="pack"+(un?" unlocked":"");let cost=pack.cost;box.innerHTML=`<div class="pack-head"><div>${pack.icon}</div><div>${pack.name}</div><button type="button" ${un||coins<cost?"disabled":""}>${un?"Earned":cost+" tokens"}</button></div><div class="options"></div>`;box.querySelector("button").addEventListener("click",()=>{if(!un&&coins>=cost){coins-=cost;saved.unlocked.push(pack.id);if(!saved.selected[pack.id])saved.selected[pack.id]=pack.options[0].id;save();$("champ").textContent="Earned "+pack.name+"! Choose an option.";hud();}});let optBox=box.querySelector(".options");pack.options.forEach(opt=>{let b=document.createElement("button");b.className="option"+(saved.selected[pack.id]===opt.id?" selected":"");b.type="button";b.textContent=opt.icon+" "+opt.name;b.disabled=!un;b.addEventListener("click",()=>{saved.selected[pack.id]=opt.id;save();hud();$("champ").textContent="Selected "+opt.name+".";});optBox.appendChild(b);});$("packs").appendChild(box);})}
function updateCar(){let pct=((question-1)/levels[level-1][2])*82;$("raceCar").style.left=`calc(${pct}% + 8px)`;$("raceCar").innerHTML=carSvg();$("carPreview").innerHTML=carSvg()}
function hud(){$("level").textContent=level;$("question").textContent=question;$("totalQ").textContent=levels[level-1][2];$("coins").textContent=coins;$("score").textContent=score;$("streak").textContent=streak;$("levelTitle").textContent="Level "+level+": "+levels[level-1][0];drawPacks();updateCar()}
function loadQ(){answered=false;current=makeTime();drawClock(current.h,current.m);$("feedback").textContent="";$("feedback").className="feedback";$("answers").innerHTML="";options(current).forEach(o=>{let b=document.createElement("button");b.type="button";b.textContent=o;b.addEventListener("click",()=>check(o));$("answers").appendChild(b)});hud()}
function sparkle(){for(let i=0;i<8;i++){let s=document.createElement("div");s.className="sparkle";s.textContent=["⏱️","🪙","✨","🏁"][r(0,3)];s.style.left=r(12,88)+"vw";s.style.top=r(25,75)+"vh";document.body.appendChild(s);setTimeout(()=>s.remove(),950)}}
function check(choice){if(answered)return;answered=true;Array.from($("answers").children).forEach(b=>b.disabled=true);if(choice===current.label){score++;streak++;let earn=1+(streak>=3?1:0);coins+=earn;$("feedback").textContent="Correct! It is "+current.words+". You earned "+earn+" Time Token"+(earn>1?"s":"")+".";$("feedback").className="feedback correct";$("raceCar").classList.add("go");sparkle();setTimeout(()=>$("raceCar").classList.remove("go"),500)}else{streak=0;$("feedback").textContent="Not quite. The time was "+current.words+" ("+current.label+").";$("feedback").className="feedback wrong"}hud();setTimeout(next,1300)}
function next(){if(question<levels[level-1][2]){question++;loadQ();return}end()}
function end(){let need=levels[level-1][3];if(score>=need){$("overlayTitle").textContent="Level "+level+" Complete!";$("overlayIcon").textContent=level>=5?"🏆":"🏁";$("overlayText").textContent="You scored "+score+"/"+levels[level-1][2]+". You can move to the next race!"}else{$("overlayTitle").textContent="Try Level "+level+" Again";$("overlayIcon").textContent="⏱️";$("overlayText").textContent="You scored "+score+"/"+levels[level-1][2]+". You need "+need+" correct to progress."}$("overlay").classList.add("visible")}
function cont(){$("overlay").classList.remove("visible");if(score>=levels[level-1][3]){if(level>=levels.length){$("overlayTitle").textContent="Time Racing Champion!";$("overlayIcon").textContent="🏆";$("overlayText").textContent="You finished all races. Keep earning tokens to unlock every garage option!";$("overlay").classList.add("visible");$("continueBtn").textContent="Race Again";$("continueBtn").onclick=()=>location.reload();return}level++}question=1;score=0;streak=0;loadQ()}
$("continueBtn").addEventListener("click",cont);loadQ();
});
</script>
</body></html>
